<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Mercury Morph</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="webgl-container"></div>
  <div class="content">
    <section class="hero">
      <h1 class="hologram">LIQUID METAL</h1>
      <h2 class="hologram-subtitle">Morphing Digital Experience</h2>
      <p class="hologram-text">Interactive WebGL mercury that responds to your touch</p>
    </section>
    <section class="projects">
      <h3 class="hologram-section">PROJECTS</h3>
      <div class="project-grid">
        <div class="project-card hologram-card">
          <h4>Quantum UI</h4>
          <p>Next-generation interface design</p>
        </div>
        <div class="project-card hologram-card">
          <h4>Neural Mesh</h4>
          <p>AI-driven 3D morphing</p>
        </div>
        <div class="project-card hologram-card">
          <h4>Fluid Systems</h4>
          <p>Real-time physics simulation</p>
        </div>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
